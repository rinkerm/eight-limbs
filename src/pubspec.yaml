name: eight_limbs
description: Muay Thai round timer with configurable rounds/rest and randomized combo callouts.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.2.3
  audio_session: ^0.2.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  wakelock_plus: ^1.2.8

  flutter_local_notifications: ^19.5.0
  
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png